name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # Desktop unit tests are pure Node (no Electron binary): --ignore-scripts skips desktop's postinstall,
      # which downloads the Electron runtime. Electron 43 has no ELECTRON_SKIP_BINARY_DOWNLOAD switch.
      - name: Desktop dependencies
        run: npm --prefix desktop ci --ignore-scripts
      - name: Desktop unit tests
        run: npm --prefix desktop test
