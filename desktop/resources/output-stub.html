<!doctype html>
<!-- Desktop stub for the output window (Phase C D4). build:web copies it to web/output.html only when the app's own
     page (src/app/output/page.tsx, Output Engineering, O4) isn't in the static export. Black, no interface. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Lab output (stub)</title>
<style>html, body { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; user-select: none; }</style>
</head>
<body data-output-stub="1">
<script>
  // Mirrors what the real page does at start: tell main it's listening, then report what it measures.
  const api = window.pixelLabOutput;
  if (api) {
    const w = Math.round(innerWidth * devicePixelRatio), h = Math.round(innerHeight * devicePixelRatio);
    api.onSession(() => {}); api.onClock(() => {}); api.onDisplay(() => {});
    api.ready();
    api.report({ sessionRevision: 0, firstFrameDrawn: false, frame: 0, devicePixelRatio, viewportCss: { width: innerWidth, height: innerHeight },
      canvasPx: { width: w, height: h }, outputPx: { width: Math.max(1, w), height: Math.max(1, h) }, browserFps: 0, lateFrames: 0, skippedFrames: 0, contentBoxDevicePx: null, sourceId: 'stub' });
  } else console.log('Pixel Lab output stub: no output preload, staying black.');
</script>
</body>
</html>
