<!doctype html>
<!-- Desktop stub for the output window (Phase C D4, D5). build:web copies it to web/output.html only when the app's own
     page (src/app/output/page.tsx, Output Engineering, O4) isn't in the static export. Black, no interface. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Lab output (stub)</title>
<style>html, body { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; user-select: none; }</style>
</head>
<body data-output-stub="1">
<script>
  // Mirrors the real page's handshake: listen, tell main it's ready, and once a session arrives report a first frame
  // (here: the black page) with that session's revision, then once a second.
  const api = window.pixelLabOutput;
  if (api) {
    let revision = null, frame = 0;
    const report = () => {
      const w = Math.round(innerWidth * devicePixelRatio), h = Math.round(innerHeight * devicePixelRatio);
      api.report({ sessionRevision: revision, firstFrameDrawn: true, frame: frame++, devicePixelRatio, viewportCss: { width: innerWidth, height: innerHeight },
        canvasPx: { width: w, height: h }, outputPx: { width: Math.max(1, w), height: Math.max(1, h) }, browserFps: 0, lateFrames: 0, skippedFrames: 0, contentBoxDevicePx: null, sourceId: 'stub' });
    };
    api.onSession(session => { document.body.dataset.clock = JSON.stringify(session.clock); const first = revision === null; revision = session.revision; requestAnimationFrame(report); if (first) setInterval(report, 1000); });
    // Last clock and display received, readable by the desktop smoke test (main-side executeJavaScript).
    api.onClock(c => { document.body.dataset.clock = JSON.stringify(c); }); api.onDisplay(d => { document.body.dataset.display = JSON.stringify(d.boundsDip); });
    api.ready();
  } else console.log('Pixel Lab output stub: no output preload, staying black.');
</script>
</body>
</html>
